name: Run tests

on: [push]

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ['22.13.0', '24.x']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:ci
      - uses: codecov/codecov-action@v7

  test-e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ['24.x']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Resolve Electron binary
        run: |
          electron_path="$(pnpm --filter electron-trpc exec node -e 'console.log(require("electron"))' | tail -n 1)"
          echo "PLAYWRIGHT_ELECTRON_PATH=$electron_path" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: xvfb-run --auto-servernum -- pnpm test:e2e
        env:
          ELECTRON_NO_SANDBOX: '1'
